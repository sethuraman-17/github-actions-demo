name: Node CI Demo

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Node Version
        run: node -v

      - name: Install Dependencies
        run: npm install

      
      - name: Workflow Finished
        run: echo "CI completed successfully!"